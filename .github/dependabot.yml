version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    # A library should not force its users onto the newest versions, so only
    # refresh uv.lock and leave the minimums in pyproject.toml alone
    versioning-strategy: "lockfile-only"
    groups:
      uv:
        patterns:
          - "*"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns:
          - "*"
