[pytest]
# Where pytest should discover tests
testpaths = ["tests"]

# Add src to Python path so imports work 
pythonpath = ["src"]

# Naming conventions for tests
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

# Add verbose summary for skipped/xfailed tests
addopts = ["-ra"]

# Fail on unknown config options, unregistered markers and similar mistakes
strict = true

# Custom markers
markers = [
    "unit: unit tests",
    "integration: tests that mock network or external services"
]