[project]
name = "pymaskinporten"
version = "1.1.4"
description = "Fetch Maskinporten Token"
readme = "README.md"
license = "Apache-2.0"
authors = [{ name = "Novica Nakov", email = "nnovica@gmail.com" }]

requires-python = ">=3.13"
dependencies = [
  "azure-identity>=1.25.2",
  "azure-keyvault-secrets>=4.10.0",
  "flask>=3.1.3",
  "httpx2>=2.12.0",
  "pydantic>=2.12.5",
  "pyjwt[crypto]>=2.15.0",
  "python-dotenv>=1.2.2",
]

[project.urls]
Homepage = "https://github.com/NorwegianVeterinaryInstitute/pymaskinporten"
Repository = "https://github.com/NorwegianVeterinaryInstitute/pymaskinporten"
Documentation = "https://norwegianveterinaryinstitute.github.io/pymaskinporten"
"Bug Tracker" = "https://github.com/NorwegianVeterinaryInstitute/pymaskinporten/issues"


[project.scripts]
maskinporten-web = "pymaskinporten.app:main"

[dependency-groups]
dev = [
  "pytest>=9.0.0",
  "ruff>=0.6.1",
  "ty>=0.0.21",
]

docs = [
    "great-docs",
]

[build-system]
requires = ["uv_build>=0.9.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "pymaskinporten"
module-root = "src"
