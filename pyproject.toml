[project]
name = "pymaskinporten"
version = "2.0.1"
description = "Python client for Maskinporten, Norway's machine-to-machine OAuth2 (JWT bearer) token service"
readme = "README.md"
license = "Apache-2.0"
authors = [{ name = "Novica Nakov", email = "nnovica@gmail.com" }]
keywords = [
  "maskinporten",
  "digdir",
  "altinn",
  "oauth2",
  "jwt",
  "access token",
  "norway",
]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.13",
  "Topic :: Security",
  "Topic :: Internet :: WWW/HTTP",
]

requires-python = ">=3.13"
dependencies = [
  "httpx2>=2.12.0",
  "pydantic>=2.12.5",
  "pyjwt[crypto]>=2.15.0",
]

[project.urls]
Homepage = "https://github.com/NorwegianVeterinaryInstitute/pymaskinporten"
Repository = "https://github.com/NorwegianVeterinaryInstitute/pymaskinporten"
Documentation = "https://norwegianveterinaryinstitute.github.io/pymaskinporten"
"Bug Tracker" = "https://github.com/NorwegianVeterinaryInstitute/pymaskinporten/issues"


[project.scripts]
pymaskinporten = "pymaskinporten.cli:main"
pymaskinporten-web = "pymaskinporten.app:main"

[project.optional-dependencies]
web = [
    "flask>=3.1.3",
    "python-dotenv>=1.2.2",
]
azure = [
    "azure-identity>=1.25.2",
    "azure-keyvault-secrets>=4.10.0",
]
aws = [
    "boto3>=1.26",
]
gcp = [
    "google-cloud-secret-manager>=2.16",
]
databricks = [
    "databricks-sdk>=0.20",
]

[dependency-groups]
dev = [
  "pytest>=9.0.0",
  "ruff>=0.17.1",
  "ty>=0.0.21",
]

docs = [
    "great-docs",
]

[build-system]
requires = ["uv_build>=0.13.1,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "pymaskinporten"
module-root = "src"
